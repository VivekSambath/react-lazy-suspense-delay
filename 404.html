<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slide Not Found | React.lazy &amp; the Hidden 300 ms Delay</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2a2c31">
<link rel="icon" href="/react-lazy-suspense-delay/assets/favicon.svg" type="image/svg+xml">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #2a2c31; color: #e9e9ec;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; text-align: center; padding: 16px; }
  h1 { font-size: 2rem; margin: 0 0 0.5rem; }
  p { color: #a6a9b1; margin: 0 0 1.4rem; }
  a { color: #61dafb; }
</style>
</head>
<body>
<main>
  <h1>404 · This slide doesn't exist</h1>
  <p>The page may have moved. Start from the first slide instead.</p>
  <a id="home" href="/react-lazy-suspense-delay/">← Back to the deck</a>
</main>
<script>
  // Works whatever the repository name is: link to the first path segment (the GitHub Pages project root).
  var seg = location.pathname.split("/").filter(Boolean)[0];
  if (location.hostname.endsWith("github.io") && seg) document.getElementById("home").href = "/" + seg + "/";
</script>
</body>
</html>
